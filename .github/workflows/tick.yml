name: tick

on:
  schedule:
    # Three times a day. Odd minute to dodge GitHub's on-the-hour load
    # spikes, which can delay or drop scheduled runs.
    - cron: "23 5,13,21 * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: minimal
          variant: CS
          version: "9.0"

      - name: Install dependencies
        run: raco pkg install --batch --auto draw-lib

      - name: Run one simulation tick
        env:
          TRMCITY_APP_PASSWORD: ${{ secrets.TRMCITY_APP_PASSWORD }}
        run: |
          printf '%s' "$TRMCITY_APP_PASSWORD" > app_password.txt
          racket main.rkt
          rm app_password.txt

      - name: Publish site to wisp.place
        env:
          TRMCITY_APP_PASSWORD: ${{ secrets.TRMCITY_APP_PASSWORD }}
        run: |
          npm install -g wispctl@latest
          wispctl deploy claude.notjack.space \
            --path site \
            --site trmcity \
            --password "$TRMCITY_APP_PASSWORD" \
            -y

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
